name: Submit an effect · 投稿特效
description: Share an Exit effect. A bot checks it and opens a pull request. · 分享一个 Exit 特效，机器人会检查并自动提交 PR。
title: "[Effect] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Paste one `.metal` file below. A bot compiles it, checks that it starts as the untouched window and ends fully transparent, measures its speed and renders a preview — results appear as a comment in a few minutes. You can edit this issue to fix things; the checks run again.

        把一个 `.metal` 文件粘贴到下面。机器人会编译它、检查首帧是否和原窗口一致、末帧是否完全透明、测性能并渲染预览，几分钟后以评论形式回复。之后可以直接编辑这个 issue 修改，检查会重新跑。

        Guide · 编写指南: [English](https://github.com/kadaliao/exit/blob/main/docs/EFFECTS.md) · [中文](https://github.com/kadaliao/exit/blob/main/docs/EFFECTS.zh-CN.md)
  - type: input
    id: effect-id
    attributes:
      label: Effect ID · 特效 ID
      description: "The file name: lowercase letters, digits and dashes. · 文件名：小写字母、数字和短横线。"
      placeholder: paper-plane
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Shader source · 源码
      description: "The whole file, header included (`// @name`, `// @description`, …). If `// @author` is missing, your GitHub name is used. · 整个文件，包括头部；没写 `// @author` 时用你的 GitHub 用户名。"
      render: metal
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes · 说明
      description: "Anything the reviewer should know (optional). · 想对审核者说的话（可选）。"
  - type: checkboxes
    id: license
    attributes:
      label: License · 许可
      options:
        - label: "I wrote this effect (or may share it) and release it under the MIT License. · 这是我写的（或我有权分享），同意以 MIT 许可证发布。"
          required: true
