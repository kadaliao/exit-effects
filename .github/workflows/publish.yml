# Builds index.json, previews and the gallery, and publishes them to the gh-pages branch
# (served at https://kadaliao.github.io/exit-effects/ and mirrored by jsDelivr).
name: Publish
on:
  push:
    branches: [main]
    paths: ["effects/**", "site/**", "scripts/**", "AGENTS.md", ".exit-version", ".github/workflows/publish.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Get Exit
        run: scripts/get-exit.sh
      - name: Check every effect
        run: python3 scripts/check.py --all --report report.md || { cat report.md >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: Plan previews
        id: plan
        run: |
          python3 scripts/build-site.py plan | tee render.txt
          echo "render=$([ -s render.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install preview tools
        if: steps.plan.outputs.render == 'true'
        run: brew install --quiet ffmpeg gifski gifsicle
      - name: Build the site
        run: python3 scripts/build-site.py build --out _site
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Publish ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
      - name: Refresh the jsDelivr mirror
        run: |
          sleep 30   # right after the push jsDelivr can still resolve gh-pages to the previous commit
          for f in index.json $(cd _site && ls effects/*.metal); do
            curl -fsS -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@gh-pages/$f" || echo "purge $f failed"
          done
