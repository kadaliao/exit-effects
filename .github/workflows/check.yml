# Checks effects added or changed by a pull request.
name: Check
on:
  pull_request:
    paths: ["effects/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15   # Metal works on the arm64 runners
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Use the base branch's checks
        run: git checkout "origin/${{ github.base_ref }}" -- scripts .exit-version
      - name: Get Exit
        run: scripts/get-exit.sh
      - name: Check
        run: |
          set +e
          python3 scripts/check.py --changed "origin/${{ github.base_ref }}" --report report.md --sheet frames.png
          code=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Upload frames
        if: always() && hashFiles('frames.png') != ''
        uses: actions/upload-artifact@v4
        with: { name: frames, path: frames.png }
